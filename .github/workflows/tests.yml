name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Generate example evaluation report
        run: PYTHONPATH=src python -m friendshield --evaluate examples/labeled_requests.csv --output evaluation-report.json
      - name: Validate evaluation JSON
        run: python -m json.tool evaluation-report.json > /dev/null
