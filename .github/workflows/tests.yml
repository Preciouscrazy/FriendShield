name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run review, evaluation, and dashboard tests
        run: python -m unittest discover -s tests -v
      - name: Exercise offline evaluation and dashboard CLI
        run: python -m friendshield --evaluate examples/labeled_requests.csv --threshold 60 --output evaluation-report.json --dashboard evaluation-dashboard.html
      - name: Validate JSON syntax
        run: python -m json.tool evaluation-report.json
